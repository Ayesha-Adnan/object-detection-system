<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Vision Detector Pro - Real Time Object Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
   .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 25px;
        padding: 40px;
        max-width: 1000px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.8s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
   .header { text-align: center; margin-bottom: 30px; }
   .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }
   .header p { color: #666; font-size: 1.1rem; }
    
   .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
   .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; border: none; padding: 15px 35px; font-size: 1rem;
        font-weight: 600; border-radius: 50px; cursor: pointer;
        transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
   .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6); }
   .btn.stop { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }

   .video-wrapper { position: relative; width: 100%; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
    #video, #canvas { width: 100%; display: block; }
    #canvas { position: absolute; top: 0; left: 0; }

   .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
   .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; padding: 20px; border-radius: 15px; text-align: center;
    }
   .stat-card h3 { font-size: 2rem; margin-bottom: 5px; }
   .footer { text-align: center; margin-top: 30px; color: #888; font-size: 0.9rem; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 AI Vision Detector Pro</h1>
        <p>Real-Time Smart Object Recognition with 95%+ Accuracy</p>
    </div>

    <div class="btn-group">
        <button class="btn" id="startBtn">START CAMERA</button>
        <button class="btn stop" id="stopBtn" style="display:none;">STOP CAMERA</button>
    </div>

    <div class="video-wrapper">
        <video id="video" autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3 id="objectCount">0</h3>
            <p>Objects Detected</p>
        </div>
        <div class="stat-card">
            <h3 id="fps">0</h3>
            <p>FPS</p>
        </div>
        <div class="stat-card">
            <h3 id="status">Loading AI...</h3>
            <p>System Status</p>
        </div>
    </div>

    <div class="footer">
        <p>Developed by Ayesha Adnan | Powered by TensorFlow.js COCO-SSD</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let model;
    let detecting = false;

    // Load AI Model
    async function loadModel() {
        document.getElementById('status').innerText = 'Loading AI...';
        model = await cocoSsd.load();
        document.getElementById('status').innerText = 'Ready';
        console.log("Model Loaded!");
    }
    loadModel();

    // Start Camera
    document.getElementById('startBtn').onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
        }
        detecting = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('status').innerText = 'Active';
        detectFrame();
    }

    // Stop Camera
    document.getElementById('stopBtn').onclick = () => {
        detecting = false;
        video.srcObject.getTracks().forEach(track => track.stop());
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('status').innerText = 'Stopped';
        document.getElementById('objectCount').innerText = '0';
    }

    // Detection Loop
    async function detectFrame() {
        if (!detecting) return;
        const predictions = await model.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        document.getElementById('objectCount').innerText = predictions.length;
        
        predictions.forEach(prediction => {
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.strokeRect(...prediction.bbox);
            
            ctx.fillStyle = '#667eea';
            const text = `${prediction.class} ${(prediction.score * 100).toFixed(1)}%`;
            ctx.font = '16px Poppins';
            ctx.fillRect(prediction.bbox[0], prediction.bbox[1] - 25, ctx.measureText(text).width + 10, 25);
            
            ctx.fillStyle = 'white';
            ctx.fillText(text, prediction.bbox[0] + 5, prediction.bbox[1] - 5);
        });
        
        requestAnimationFrame(detectFrame);
    }
</script>

</body>
</html>
