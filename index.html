<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Detection System</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>
  body { font-family: Arial; text-align: center; background: #f0f0f0; padding: 20px; }
  h1 { color: #333; }
  video, canvas, img { border: 3px solid #4CAF50; border-radius: 10px; max-width: 90%; }
  button { padding: 10px 20px; margin: 10px; font-size: 16px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
  #result { font-size: 18px; margin-top: 10px; color: #333; }
</style>
</head>
<body>
<h1>Object Detection System</h1>

<div>
  <button onclick="startCamera()">Start Live Camera</button>
  <input type="file" id="imageUpload" accept="image/*" onchange="detectImage(event)">
</div>

<div>
  <video id="video" width="640" height="480" autoplay style="display:none;"></video>
  <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
  <img id="uploadedImage" style="display:none; max-width:640px;">
</div>

<div id="result">Camera start karo ya image upload karo</div>

<script>
let model;

async function loadModel() {
  document.getElementById('result').innerText = "Model load ho raha hai... wait karo";
  model = await cocoSsd.load();
  document.getElementById('result').innerText = "Model ready! Ab start karo";
}
loadModel();

async function startCamera() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  video.style.display = 'block';
  canvas.style.display = 'block';
  document.getElementById('uploadedImage').style.display = 'none';

  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;

  video.onloadedmetadata = () => {
    detectVideo();
  }
}

async function detectVideo() {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  if (model) {
    const predictions = await model.detect(video);
    ctx.drawImage(video, 0, 0, 640, 480);

    predictions.forEach(pred => {
      ctx.beginPath();
      ctx.rect(...pred.bbox);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'red';
      ctx.stroke();
      ctx.font = "16px Arial";
      ctx.fillStyle = "red";
      ctx.fillText(`${pred.class} ${(pred.score*100).toFixed(1)}%`, pred.bbox[0], pred.bbox[1]-5);
    });

    document.getElementById('result').innerText = predictions.length > 0?
      `Detected: ${predictions.map(p=>p.class).join(', ')}` : "Koi object nahi mila";
  }
  requestAnimationFrame(detectVideo);
}

async function detectImage(event) {
  const img = document.getElementById('uploadedImage');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  img.src = URL.createObjectURL(event.target.files[0]);
  img.style.display = 'block';
  document.getElementById('video').style.display = 'none';
  canvas.style.display = 'block';

  img.onload = async () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    const predictions = await model.detect(img);
    predictions.forEach(pred => {
      ctx.beginPath();
      ctx.rect(...pred.bbox);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'red';
      ctx.stroke();
      ctx.font = "18px Arial";
      ctx.fillStyle = "red";
      ctx.fillText(`${pred.class} ${(pred.score*100).toFixed(1)}%`, pred.bbox[0], pred.bbox[1]-5);
    });

    document.getElementById('result').innerText = predictions.length > 0?
      `Detected: ${predictions.map(p=>p.class).join(', ')}` : "Koi object nahi mila";
  }
}
</script>
</body>
</html>
