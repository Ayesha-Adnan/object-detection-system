<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Object Detection System</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
 .container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 25px;
        padding: 40px;
        max-width: 1000px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: fadeIn 0.8s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
 .header { text-align: center; margin-bottom: 30px; }
 .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }
 .header p { color: #666; font-size: 1.1rem; }

 .btn-group { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
 .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; border: none; padding: 15px 35px; font-size: 1rem;
        font-weight: 600; border-radius: 50px; cursor: pointer;
        transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        display: inline-block;
    }
 .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6); }
 .btn.stop { background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); }
    input[type="file"] { display: none; }

 .video-wrapper,.result-area { position: relative; width: 100%; text-align: center; margin-top: 20px; }
    #video, #image, #canvas { max-width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
    #canvas { position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none; }

 .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
 .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white; padding: 20px; border-radius: 15px; text-align: center;
    }
 .stat-card h3 { font-size: 2rem; margin-bottom: 5px; }
 .footer { text-align: center; margin-top: 30px; color: #888; font-size: 0.9rem; }
    #loading { color: #667eea; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 Object Detection System</h1>
        <p>Real-Time Camera + Image Upload Detection</p>
    </div>

    <div class="btn-group">
        <button class="btn" id="startBtn">START CAMERA</button>
        <button class="btn stop" id="stopBtn" style="display:none;">STOP CAMERA</button>

        <label for="fileInput" class="btn">CHOOSE IMAGE</label>
        <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <p id="loading" style="text-align:center;"></p>

    <div class="video-wrapper">
        <video id="video" autoplay muted style="display:none;"></video>
        <img id="image" style="display:none;">
        <canvas id="canvas"></canvas>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3 id="objectCount">0</h3>
            <p>Objects Detected</p>
        </div>
        <div class="stat-card">
            <h3 id="mode">Idle</h3>
            <p>Current Mode</p>
        </div>
        <div class="stat-card">
            <h3 id="status">Loading AI...</h3>
            <p>System Status</p>
        </div>
    </div>

    <div class="footer">
        <p>Developed by Ayesha Adnan | Object Detection System</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const image = document.getElementById('image');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let model;
    let detecting = false;

    // 1. AI Model Load
    async function loadModel() {
        document.getElementById('status').innerText = 'Loading AI...';
        model = await cocoSsd.load();
        document.getElementById('status').innerText = 'Ready';
    }
    loadModel();

    // 2. CAMERA MODE
    document.getElementById('startBtn').onclick = async () => {
        stopImageMode();
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.style.display = 'block';
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.style.width = video.videoWidth + 'px';
            canvas.style.height = video.videoHeight + 'px';
        }
        detecting = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('mode').innerText = 'Camera';
        document.getElementById('status').innerText = 'Active';
        detectVideoFrame();
    }

    document.getElementById('stopBtn').onclick = () => {
        detecting = false;
        video.srcObject.getTracks().forEach(track => track.stop());
        video.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('mode').innerText = 'Idle';
        document.getElementById('status').innerText = 'Ready';
        document.getElementById('objectCount').innerText = '0';
    }

    async function detectVideoFrame() {
        if (!detecting) return;
        const predictions = await model.detect(video);
        drawPredictions(predictions, video.videoWidth, video.videoHeight);
        requestAnimationFrame(detectVideoFrame);
    }

    // 3. IMAGE UPLOAD MODE
    document.getElementById('fileInput').addEventListener('change', async (e) => {
        if(detecting) document.getElementById('stopBtn').click(); // camera band kar do
        stopImageMode();

        const files = e.target.files;
        if (files.length === 0) return;

        for(let file of files) {
            document.getElementById('loading').innerText = 'Detecting... Please wait';
            document.getElementById('mode').innerText = 'Image';
            const reader = new FileReader();
            reader.onload = async () => {
                image.src = reader.result;
                image.style.display = 'block';
                await image.onload;

                canvas.width = image.width;
                canvas.height = image.height;
                canvas.style.width = image.width + 'px';
                canvas.style.height = image.height + 'px';

                const predictions = await model.detect(image);
                drawPredictions(predictions, image.width, image.height);
                document.getElementById('loading').innerText = '';
            }
            reader.readAsDataURL(file);
        }
    });

    function stopImageMode() {
        image.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 4. Drawing Function for both
    function drawPredictions(predictions, w, h) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('objectCount').innerText = predictions.length;
        document.getElementById('status').innerText = 'Done';

        predictions.forEach(prediction => {
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.strokeRect(...prediction.bbox);

            ctx.fillStyle = '#667eea';
            const text = `${prediction.class} ${(prediction.score * 100).toFixed(1)}%`;
            ctx.font = '16px Poppins';
            ctx.fillRect(prediction.bbox[0], prediction.bbox[1] - 25, ctx.measureText(text).width + 10, 25);

            ctx.fillStyle = 'white';
            ctx.fillText(text, prediction.bbox[0] + 5, prediction.bbox[1] - 5);
        });
    }
</script>

</body>
</html>
